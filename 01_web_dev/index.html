<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="sub/static/estilo/styles.css">
    <link rel="icon" type="image/x-icon" href="static/imagenes/logo.png">
</head>
<body class="lgin">
    <h1 class="form-heading">Inicia Sesion</h1>
    <form id="loginForm" class="form-container">
        <div>
            <label for="username" class="form-label">Usuario:</label>
            <input type="text" id="username" name="username" required class="form-input">
        </div>
        <div>
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" id="password" name="password" required class="form-input">
        </div>
        <button type="submit" class="form-submit">Iniciar Sesion</button>
    </form>

    <script src="sub/static/loginprocessor.js"></script>
</body>
</html>
